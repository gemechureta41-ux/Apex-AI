<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI - Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 260px; background-color: #1e1f20; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #2d2e30; transition: 0.3s; }
        .new-chat-btn { background: #282a2c; color: #e3e3e3; border: none; padding: 12px 16px; border-radius: 24px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; transition: 0.2s; }
        .new-chat-btn:hover { background: #3c4043; }
        
        /* Main Chat Area */
        .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        .chat-header { padding: 15px 25px; font-size: 18px; font-weight: 600; border-bottom: 1px solid #2d2e30; background: #131314; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 900px; width: 100%; margin: 0 auto; }
        .message { display: flex; gap: 15px; max-width: 80%; line-height: 1.6; font-size: 15px; }
        .message.user { align-self: flex-end; background: #282a2c; padding: 12px 18px; border-radius: 18px 18px 4px 18px; }
        .message.ai { align-self: flex-start; background: transparent; padding: 10px 0; }
        
        /* Input Area */
        .input-container { padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; background: #131314; }
        .input-box { background: #1e1f20; border-radius: 28px; padding: 10px 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #3c4043; }
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 8px 0; }
        .send-btn { background: #c4eed0; color: #1f1f1f; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; }
        .send-btn:hover { background: #a8f2bd; }
        
        .options { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: #aaa; }
        
        /* Responsive for Mobile */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
        <div style="margin-top: auto; font-size: 12px; color: #888;">
            <p>Version: 3.0 Pro</p>
            <p>Developer: Gemechu Reta</p>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-header">
            <span>Apex AI Web Dashboard</span>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <strong>Apex AI:</strong> Hello! My name is Apex AI. I can understand all world languages and Afaan Oromoo fully, reply in whatever language you ask, and assist you instantly. How can I help you today?
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Ask anything in any language..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
            <div class="options">
                <label><input type="checkbox" id="useSearch"> Enable Google/Web Search</label>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const prompt = inputField.value.trim();
            const useSearch = document.getElementById('useSearch').checked;
            const messagesContainer = document.getElementById('chatMessages');

            if (!prompt) return;

            // User Message
            messagesContainer.innerHTML += `<div class="message user">${escapeHtml(prompt)}</div>`;
            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Loading message (Instant indicator)
            const loadingId = 'loading-' + Date.now();
            messagesContainer.innerHTML += `<div class="message ai" id="${loadingId}"><strong>Apex AI:</strong> Generating...</div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);
                formData.append('use_search', useSearch);

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.status === 'success') {
                    messagesContainer.innerHTML += `<div class="message ai"><strong>Apex AI:</strong> ${formatText(data.response)}</div>`;
                } else {
                    messagesContainer.innerHTML += `<div class="message ai" style="color: #ff8b8b;"><strong>Error:</strong> ${data.message}</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                messagesContainer.innerHTML += `<div class="message ai" style="color: #ff8b8b;"><strong>Error:</strong> Connection failed.</div>`;
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatText(text) {
            return text.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
